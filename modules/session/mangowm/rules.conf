# Monitor rules
monitorrule=name:DP-3,width:3440,height:1440,refresh:165

# Tag rules
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
circle_layout=scroller,tile,center_tile
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Window rules
windowrule=appid:vesktop,tags:1
windowrule=class:vesktop,tags:1
windowrule=appid:spotify,tags:1
windowrule=class:Spotify,tags:1

# Floating Terminal
windowrule=appid:floating-terminal,isfloating:1
windowrule=class:floating-terminal,isfloating:1
