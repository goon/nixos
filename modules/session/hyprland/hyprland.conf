# Hyprland Config - Replicating Niri Setup

# Monitor
monitor=DP-3,3440x1440@160,0x0,1

# Environment Variables
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Autostart
exec-once = quickshell
exec-once = vesktop
exec-once = spotify
exec-once = systemctl --user start hyprpolkitagent

# Input
input {
    kb_layout = gb
    repeat_delay = 200
    repeat_rate = 35
    numlock_by_default = true
    
    follow_mouse = 1
    accel_profile = flat
    force_no_accel = false
    sensitivity = 0.0
}

# General Layout
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(d4be98ff) rgba(7c6f64ff) 45deg
    col.inactive_border = rgba(252535ff)
    layout = scrolling
}

# Decoration
decoration {
    rounding = 12
    
    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1F1F28ff)
    }
}

# Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

# Dwindle Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

scrolling { 
    
}

# Binds
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, N, exec, kitty -e nvim
bind = $mainMod, B, exec, brave
bind = $mainMod, M, exec, obsidian
bind = $mainMod, T, exec, kitty --title floating-terminal
bind = $mainMod, SPACE, exec, qs ipc call launcher toggle
bind = $mainMod, G, exec, qs ipc call wallpaper toggle
bind = $mainMod, S, exec, qs ipc call settings toggle
bind = $mainMod, P, exec, qs ipc call power toggle

# Screenshot (mimicking Niri's screenshot tool might need grim/slurp)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = CTRL, Print, exec, grim - | wl-copy

# Power
bind = $mainMod SHIFT, Q, exit,
bind = CTRL ALT, Delete, exit,
bind = $mainMod SHIFT, P, exec, hyprctl dispatch dpms off

# Audio & Backlight
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
binde = , XF86MonBrightnessUp, exec, brightnessctl set +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Window Management
bind = $mainMod, X, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 1  # Maximize
bind = $mainMod SHIFT, F, fullscreen, 0 # Fullscreen

# Focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod, Tab, workspace, previous
bind = $mainMod, W, togglegroup,
bind = $mainMod, G, togglegroup, # Alternative if W is taken or preferred
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d
bind = $mainMod CTRL, Left, movewindow, l
bind = $mainMod CTRL, Right, movewindow, r
bind = $mainMod CTRL, Up, movewindow, u
bind = $mainMod CTRL, Down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Rules
windowrule = float 1, match:class ^brave-browser$, match:title ^Picture-in-Picture$

# QuickShell Blur (mimicking Niri's layer rule)
layerrule = blur 1, match:namespace ^quickshell.*$
layerrule = ignore_alpha 0.5, match:namespace ^quickshell.*$
