bind=SUPER,space,spawn,qs ipc call launcher toggle
bind=SUPER,g,spawn,qs ipc call wallpaper toggle
bind=SUPER,s,spawn,qs ipc call settings toggle
bind=SUPER,p,spawn,qs ipc call power toggle
